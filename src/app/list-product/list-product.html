<div class="container">
  <div class="container text-center" style="margin: 3vh">
    <h3>System inventory</h3>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Description</th>
        <th scope="col">Price</th>
        <th scope="col">Existence</th>
        <th scope="col" class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for(product of products; track product.idProduct){
      <tr>
        <th scope="row">{{product.idProduct}}</th>
        <td>{{product.description}}</td>
        <td>{{product.price}}</td>
        <td>{{product.existence}}</td>
        <td class="text-center">
          <div>
            <button (click)="editProduct(product.idProduct)" class="btn btn-warning btn-sm me-3">Edit</button>
            <button (click)="deleteProduct(product.idProduct)" class="btn btn-danger btn-sm me-3">Delete</button>
          </div>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
